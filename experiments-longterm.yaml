# Long-term AF tasks for the benchmark website: MIT-BIH AFDB, LTAFDB and the
# pooled Unified AF task, for the same 24 architectures as experiments.yaml,
# each pairing trained once with seed 42 (72 runs). They are not part of the
# article grid. Run with:
#   python scripts/run_experiments.py --config experiments-longterm.yaml --resume
#
# mamba and afmodel are absent for the reasons given in experiments.yaml.

defaults:
  seeds: [42]
  sampling_rate: 500

experiments:
  # --------------------------------------------------------------------------
  # MIT-BIH AFDB: first lead only, AF vs non-AF.
  # Binary. Resampled to 500 Hz x 10 s = 5000 samples.
  # --------------------------------------------------------------------------
  - model: convnext-v2
    dataset: mitbih-afdb
    binary_classification: true
  - model: crnn
    dataset: mitbih-afdb
    binary_classification: true
  - model: deep-res-cnn
    dataset: mitbih-afdb
    binary_classification: true
  - model: dualnet
    dataset: mitbih-afdb
    binary_classification: true
  - model: fcn-wang
    dataset: mitbih-afdb
    binary_classification: true
  - model: gru
    dataset: mitbih-afdb
    binary_classification: true
  - model: inception-time
    dataset: mitbih-afdb
    binary_classification: true
  - model: kanres
    dataset: mitbih-afdb
    binary_classification: true
  - model: kanres-deep
    dataset: mitbih-afdb
    binary_classification: true
  - model: lstm
    dataset: mitbih-afdb
    binary_classification: true

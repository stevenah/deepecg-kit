[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepecgkit*"]

[tool.setuptools.package-data]
deepecgkit = ["py.typed"]

[project]
name = "deepecgkit"
version = "0.2.0"
authors = [
    { name = "Steven", email = "steven@simula.no" },
]
description = "A deep learning toolkit for ECG analysis"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
# The lower bounds are the oldest versions the test suite has been run on
# (Python 3.10); the ones declared before could not even be installed there.
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "torch>=2.1.0",
    "pandas>=1.4.0",
    "scikit-learn>=1.1.0",
    "matplotlib>=3.5.0",
    "wfdb>=4.0.0",
    "seaborn>=0.11.2",
    "tqdm>=4.60.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
deepecg = "deepecgkit.cli:main"

# Keep in sync with [dependency-groups]; dependency-groups is canonical (uv).
# This extra exists so `pip install -e ".[dev]"` works for non-uv users.
[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=3.0.0",
    "ruff>=0.11.13",
    "mypy>=1.10",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-autorefs>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=3.0.0",
    "ruff>=0.11.13",
    "mypy>=1.10",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "mkdocs-autorefs>=1.0.0",
]

[tool.uv]
# scipy 1.15.x macOS wheels fail to load on macOS 27 (dlopen error in
# scipy.sparse.linalg._propack), and 1.15 is the last series supporting
# Python 3.10. Development-lock constraint only; not published metadata.
constraint-dependencies = ["scipy!=1.15.*; sys_platform == 'darwin'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["deepecgkit", "scripts"]
omit = [
    "tests/*",
    "**/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF", "W"]
lint.ignore = ["E501", "PLR0911", "PLR0913", "PLR0915", "PLR2004", "PLR0912", "E712", "RUF015"]
lint.isort.known-first-party = ["deepecgkit"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

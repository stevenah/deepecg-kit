# Training defaults come from deepecgkit/cli/defaults.py; override any of
# them here (epochs, batch_size, learning_rate, val_split, test_split,
# num_workers, accelerator, devices, early_stopping_patience, seed).
defaults:
  seeds: [42, 43, 44, 45, 46]

experiments:
  # ──────────────────────────────────────────────
  # PTB-XL: 12-lead, 5 diagnostic superclasses
  # Task: multi-label classification
  # ──────────────────────────────────────────────
  - model: resnet
    dataset: ptbxl
    multi_label: true

  - model: se-resnet
    dataset: ptbxl
    multi_label: true

  - model: inception-time
    dataset: ptbxl
    multi_label: true

  - model: convnext-v2
    dataset: ptbxl
    multi_label: true

  - model: crnn
    dataset: ptbxl
    multi_label: true

  # ──────────────────────────────────────────────
  # PhysioNet 2017: 1-lead, 4 classes
  # Task: single-label multi-class classification
  # ──────────────────────────────────────────────
  - model: resnet
    dataset: af-classification

  - model: se-resnet
    dataset: af-classification

  - model: inception-time
    dataset: af-classification

  - model: convnext-v2
    dataset: af-classification

  - model: crnn
    dataset: af-classification

  # ──────────────────────────────────────────────
  # MIT-BIH AFDB: 2-lead, binary AF detection
  # Task: binary classification (AF vs Non-AF)
  # ──────────────────────────────────────────────
  - model: resnet
    dataset: mitbih-afdb
    binary_classification: true

  - model: se-resnet
    dataset: mitbih-afdb
    binary_classification: true

  - model: inception-time
    dataset: mitbih-afdb
    binary_classification: true

  - model: convnext-v2
    dataset: mitbih-afdb
    binary_classification: true

  - model: crnn
    dataset: mitbih-afdb
    binary_classification: true

  # ──────────────────────────────────────────────
  # Unified AF: cross-dataset, 4 classes
  # Task: single-label multi-class (combined sources)
  # ──────────────────────────────────────────────
  - model: resnet
    dataset: unified-af

  - model: convnext-v2
    dataset: unified-af

  - model: crnn
    dataset: unified-af


# Training defaults come from deepecgkit/cli/defaults.py; override any of
# them here (epochs, batch_size, learning_rate, val_split, test_split,
# num_workers, accelerator, devices, early_stopping_patience, seed).
#
# THE FULL GRID: every registered architecture on every registered dataset.
# 20 models x 5 datasets = 100 pairings x 5 seeds = 500 runs.
#
# Why the whole grid and not just the gaps: the currently published snapshot
# (deepecg-kit-bench, 2026-cbms-preliminary) was built with include_legacy and
# replicate_ids [-1] -- one seedless run per pair. Those runs are no longer on
# disk, and a snapshot is aggregated from run directories, so re-running the
# 24 already-covered pairings is what turns the next snapshot from
# "preliminary, one run per pair" into a seeded one that can be declared
# current. `--resume` makes stopping and restarting cheap.
#
# afmodel is ABSENT DELIBERATELY. AFModel(recording_length=30) requires at
# least 7971 samples per lead, and every dataset here emits 3000 (300 Hz) or
# 5000 (PTB-XL, 500 Hz), so all five pairings raise ValueError at build time.
# It is not a missing entry; it is structurally incompatible with a 10-second
# segmentation. Verified by building all 21 x 5 combinations -- see
# scripts/preflight_experiments.py. Give it 30-second segments, or a smaller
# recording_length, before adding it back.
#
# Ordered task-major so `--limit` and a Ctrl-C leave you with whole tasks
# finished rather than a thin slice of each.

defaults:
  seeds: [42, 43, 44, 45, 46]

experiments:

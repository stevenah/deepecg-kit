# Training defaults come from deepecgkit/cli/defaults.py; override any of
# them here (epochs, batch_size, learning_rate, val_split, test_split,
# num_workers, accelerator, devices, early_stopping_patience, seed), and the
# preprocessing (sampling_rate, segment_duration, normalization).
#
# THE ARTICLE GRID: the 27 benchmarked architectures on PTB-XL and PhysioNet
# 2017, each pairing trained once with seed 42 = 54 runs. PTB-XL uses its
# recommended folds (1-8 train, 9 validation, 10 test) and the label rule of
# the PTB-XL benchmark, both dataset defaults since 1.0. The long-term AF
# tasks (MIT-BIH AFDB, LTAFDB, Unified AF) are in experiments-longterm.yaml;
# their results go to the benchmark website. `--resume` makes stopping and
# restarting cheap.
#
# mamba is ABSENT DELIBERATELY: it was dropped from the journal benchmark.
#
# lstm is ABSENT DELIBERATELY: it was dropped from the journal benchmark on
# 2026-10-29.
#
# afmodel is ABSENT DELIBERATELY. AFModel(recording_length=30) requires at
# least 7971 samples per lead, and the CLI resamples every dataset to 500 Hz,
# so each emits 5000 samples per lead and all five pairings raise ValueError at
# build time.
# It is not a missing entry; it is structurally incompatible with a 10-second
# segmentation. Verified by building all 21 x 5 combinations -- see
# scripts/preflight_experiments.py. Give it 30-second segments, or a smaller
# recording_length, before adding it back.
#
# Ordered task-major so `--limit` and a Ctrl-C leave you with whole tasks
# finished rather than a thin slice of each.

defaults:
  seeds: [42]
  # Every task is trained at 500 Hz, as the article states. Without this the AF
  # datasets fall back to their own default of 300 Hz (3000 samples per window),
  # and the probe, attribution and zero-shot stages, which run at 500 Hz, would
  # no longer match the encoders.
  sampling_rate: 500

experiments:
  # --------------------------------------------------------------------------
  # PTB-XL: 12-lead, 5 diagnostic superclasses (NORM, MI, STTC, CD, HYP).
  # Multi-label. 500 Hz x 10 s = 5000 samples per lead.
  # --------------------------------------------------------------------------
